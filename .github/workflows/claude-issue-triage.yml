

name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Claude triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh api:*)"
            --max-turns 15
          prompt: |
            Eres un asistente de triage de issues para el repo ${{ github.repository }},
            un juego de Tetris en JS vanilla (game.js, index.html, style.css, sin build step).
            Debes analizar el issue #${{ github.event.issue.number }} y hacer dos cosas:
            aplicarle labels apropiados y publicar un diagnóstico técnico como comentario.
            No escribas código, no abras PRs, no cierres el issue.

            Pasos:

            1. Lee el issue con:
               gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json title,body,labels,comments

            2. Lee CLAUDE.md primero para entender la arquitectura del juego (board, piezas,
               collide, tryRotate, clearLines, lockPiece, ghostY, scoring, dropInterval).
               Luego lee game.js (y index.html/style.css si aplica) para ubicar con precisión
               las funciones/líneas relacionadas con lo que describe el issue.

            3. Aplica labels con:
               gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label "..."
               Elige ÚNICAMENTE de esta lista fija, la que mejor aplique (una o varias):
               bug, enhancement, documentation, accessibility, question, duplicate, invalid,
               wontfix, "good first issue", help wanted
               NUNCA uses --create-label ni crees labels nuevos. Si no hay evidencia clara de
               ninguna categoría, usa "question". No quites labels que ya existan salvo que sean
               claramente incorrectos.

            4. Publica (o actualiza) un comentario en español con este diagnóstico. Antes de
               comentar, busca si ya existe un comentario tuyo anterior en este issue que
               contenga el marcador HTML `<!-- claude-triage -->` usando:
               gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments
               Si existe, actualízalo con:
               gh api --method PATCH repos/${{ github.repository }}/issues/comments/<id> -f body='...'
               Si no existe, créalo con:
               gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body '...'

               El comentario debe tener EXACTAMENTE este formato (Markdown):

               <!-- claude-triage -->
               ## Diagnóstico automático

               **Tipo:** bug | mejora | documentación | pregunta
               **Área:** (ej. rotación de piezas / line clear / render / input / scoring / UI)
               **Archivos probables:** `game.js:<líneas>` …

               ### Resumen
               ...

               ### Causa probable / análisis
               ...

               ### Enfoque de solución propuesto
               1. ...
               2. ...

               ### Riesgos y casos borde
               ...

               ### Información faltante
               ... (o "ninguna")

            Sé concreto y técnico, citando funciones y líneas reales de game.js cuando sea
            posible. Este diagnóstico se usará después para implementar la solución, así que
            el enfoque de solución propuesto debe ser accionable.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
